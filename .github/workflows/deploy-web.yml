name: Deploy web edition to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MaridewFinance.App/wwwroot/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A single JS syntax error takes down the whole dashboard (or, worse,
      # silently disables the Android background sync bridge), so parse-check
      # every shipped script and run the sync-core unit tests before deploy.
      - name: Parse-check and unit-test web scripts
        run: |
          node tests/parse-check.js
          node tests/run-tests.js

  deploy:
    runs-on: ubuntu-latest
    needs: [checks]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The web edition is pure static files (no build step). Copy wwwroot to
      # the artifact root so the site is served from the Pages domain root.
      - name: Stage web files
        shell: bash
        run: |
          mkdir -p _site
          cp -r MaridewFinance.App/wwwroot/. _site/
          echo "web edition files:"; find _site -type f | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
