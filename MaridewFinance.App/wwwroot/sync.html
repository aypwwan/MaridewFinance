<!DOCTYPE html>
<!--
  Headless sync controller for the Android SyncService.

  The service hosts this page in a hidden WebView and evaluates
  __maridewSync.sync() on a native timer. The bridge runs in headless mode
  (?headless=1): no auth gate, no dashboard, no poller - just the same
  IndexedDB storage, cloud token and AES key as the visible app, so a sync
  here is exactly a sync in the app. sync() pulls first, merges, then pushes
  only when local tables differ from the cloud, and returns a JSON summary
  that lets the service raise a notification when new entries arrived.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maridew Sync</title>
  <script src="web-bridge.js"></script>
</head>
<body>
  <p>Maridew Finance background sync is active.</p>
</body>
</html>
